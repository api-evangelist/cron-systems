aid: cron-systems
name: Cron Systems
description: >-
  Cron Systems (now operating as Cron AI) builds deep-learning perception software
  for 3D sensor and LiDAR data. Its flagship platform, senseEDGE, performs real-time
  3D object detection, classification, and tracking from point-cloud data at the edge,
  with multi-sensor fusion and adverse-weather resilience. The technology serves
  intelligent transportation systems, smart infrastructure, autonomous mobility,
  smart cities, and security and surveillance — powering use cases such as traffic
  management, autonomous tolling, crowd and queue management, smart parking, vehicle
  counting, and airport and aircraft-movement monitoring. Object output is emitted as
  JSON and Flatbuffers binary over WebSocket, with a web-based configuration and
  visualizer utility, VPN and PTP time-synchronization support, and a privacy-preserving,
  GDPR-compliant design. Cron AI was surfaced as a Techstars portfolio company and added
  to the API Evangelist network; the company currently publishes no public developer API,
  documentation, or SDK surface.
